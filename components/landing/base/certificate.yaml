# Its own cert: an Ingress cannot read wildcard-calabri-tls, which lives in the sonrisas namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: landing
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: landing-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - calabri.net
    - www.calabri.net
