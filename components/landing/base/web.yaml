apiVersion: v1
kind: Service
metadata:
  name: landing-web
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: landing-web
  ports:
    - name: http
      port: 4321
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-web
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: landing-web
  template:
    metadata:
      labels:
        app: landing-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/calabri1/calabri-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4321
          envFrom:
            # optional: the static page must come up even before the contact-form secret exists.
            - secretRef:
                name: landing-secrets
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: landing-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: landing-web
